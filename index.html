<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViveX Admin Panel</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root {
  --red:#f01828;
  --bg:#080808;
  --panel:#141414;
  --line:#292929;
  --muted:#999;
  --green:#20c879;
  --yellow:#f5b942;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
}
button { font:inherit; cursor:pointer; }
.container {
  max-width:600px;
  min-height:100vh;
  padding:20px 15px 35px;
  margin:auto;
}
.hidden { display:none!important; }
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0 22px;
}
.logo {
  font-size:23px;
  font-weight:900;
}
.logo span { color:var(--red); }
.admin-label {
  color:var(--red);
  border:1px solid #64232a;
  background:#1b0d0f;
  padding:7px 10px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
}
.login-box {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:25px 17px;
  text-align:center;
  margin-top:60px;
}
.login-box h2 { margin:0 0 10px; }
.muted {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.google-area {
  display:flex;
  justify-content:center;
  margin-top:20px;
}
.dashboard-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 18px;
}
.dashboard-top h2 {
  font-size:20px;
  margin:0;
}
.logout {
  background:#242424;
  border:1px solid var(--line);
  color:#ddd;
  border-radius:7px;
  padding:9px 12px;
  font-size:12px;
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:20px;
}
.stat {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px 8px;
}
.stat small {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:9px;
}
.stat strong { font-size:22px; }
.tabs {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:18px;
}
.tab {
  background:#151515;
  border:1px solid var(--line);
  color:#aaa;
  border-radius:8px;
  padding:12px 4px;
  font-size:11px;
  font-weight:bold;
}
.tab.active {
  background:#260d10;
  border-color:var(--red);
  color:white;
}
.section-heading {
  font-size:16px;
  font-weight:800;
  margin:18px 0 13px;
}
.request-card {
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--yellow);
  border-radius:11px;
  padding:15px;
  margin-bottom:12px;
}
.request-card.approved { border-left-color:var(--green); }
.request-card.rejected { border-left-color:var(--red); }
.card-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.person-name {
  font-size:15px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.status {
  font-size:9px;
  font-weight:bold;
  padding:6px 8px;
  border-radius:5px;
  background:#30260f;
  color:var(--yellow);
  flex-shrink:0;
}
.status.approved {
  color:var(--green);
  background:#10271c;
}
.status.rejected {
  color:#ff626c;
  background:#301115;
}
.detail {
  margin:9px 0;
  font-size:12px;
  color:#bbb;
  overflow-wrap:anywhere;
}
.detail b {
  color:#fff;
  font-weight:600;
}
.card-actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}
.action {
  border:0;
  border-radius:7px;
  padding:11px 5px;
  font-size:12px;
  font-weight:800;
  color:white;
}
.approve { background:#16894e; }
.reject { background:#b82230; }
.action:disabled {
  opacity:.45;
  cursor:not-allowed;
}
.empty {
  background:var(--panel);
  border:1px dashed #333;
  border-radius:10px;
  padding:25px 12px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
.message {
  font-size:12px;
  line-height:1.6;
  margin:12px 0;
  text-align:center;
}
.error { color:#ff646c; }
.success { color:var(--green); }
.refresh {
  width:100%;
  padding:12px;
  margin:0 0 12px;
  border:1px solid var(--line);
  background:#171717;
  color:white;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}
.footer {
  text-align:center;
  color:#555;
  font-size:10px;
  margin-top:30px;
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <div class="logo">ViveX <span>Admin</span></div>
    <div class="admin-label">CONTROL PANEL</div>
  </header>

  <!-- LOGIN -->
  <section id="loginPage" class="login-box">
    <h2>Admin Login</h2>
    <p class="muted">
      Sign in using an authorized Google Admin account.
    </p>
    <div class="google-area">
      <div id="googleButton"></div>
    </div>
    <div id="loginMessage" class="message"></div>
  </section>

  <!-- DASHBOARD -->
  <main id="dashboard" class="hidden">

    <div class="dashboard-top">
      <h2>Dashboard</h2>
      <button class="logout" onclick="logout()">LOGOUT</button>
    </div>

    <div class="stats">
      <div class="stat">
        <small>NEW REQUESTS</small>
        <strong id="pendingCount">0</strong>
      </div>
      <div class="stat">
        <small>APPROVED</small>
        <strong id="approvedCount">0</strong>
      </div>
      <div class="stat">
        <small>REJECTED</small>
        <strong id="rejectedCount">0</strong>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('pending',this)">
        NEW REQUESTS
      </button>
      <button class="tab" onclick="showTab('approved',this)">
        APPROVED
      </button>
      <button class="tab" onclick="showTab('rejected',this)">
        REJECTED
      </button>
    </div>

    <button class="refresh" onclick="loadDashboard()">
      ↻ REFRESH DATA
    </button>

    <div id="content">
      <div class="section-heading">New Payment Requests</div>
      <div class="empty">Loading requests...</div>
    </div>

    <div id="actionMessage" class="message"></div>
  </main>

  <div class="footer">ViveX Sensi • Admin Control Panel</div>
</div>

<script>
/* ===================================
   CONFIG
=================================== */

const CONFIG = {
  BACKEND_URL:
  "https://script.google.com/macros/s/AKfycbxCCQWS8ADq-fDmTAqtbvGcAXWe8BZbqBroCwslkCW6yx4398KgHC4pSYLK6bZnszLPZg/exec",

  GOOGLE_CLIENT_ID:
  "830557350336-o298m4pmuk7ts0ifp2ieeq468mddcqqs.apps.googleusercontent.com"
};

let idToken = "";
let currentTab = "pending";

let pendingPayments = [];
let approvedPayments = [];
let rejectedPayments = [];

/* ===================================
   BACKEND
=================================== */

async function callBackend(action, extra = {}) {
  const response = await fetch(CONFIG.BACKEND_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action,
      idToken,
      ...extra
    })
  });

  if (!response.ok) {
    throw new Error("Backend connection failed.");
  }

  return await response.json();
}

/* ===================================
   GOOGLE LOGIN
=================================== */

function initializeGoogle() {
  if (!window.google || !google.accounts) {
    setTimeout(initializeGoogle, 300);
    return;
  }

  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: handleLogin,
    auto_select: false
  });

  google.accounts.id.renderButton(
    document.getElementById("googleButton"),
    {
      theme: "outline",
      size: "large",
      shape: "rectangular",
      text: "signin_with",
      width: 250
    }
  );
}

async function handleLogin(response) {
  idToken = response.credential;

  const message = document.getElementById("loginMessage");
  message.className = "message";
  message.textContent = "Verifying admin account...";

  try {
    const result = await callBackend("adminLogin");

    if (!result.success) {
      throw new Error(result.message || "Admin access denied.");
    }

    sessionStorage.setItem("vivex_admin_token", idToken);

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    await loadDashboard();

  } catch (error) {
    idToken = "";
    message.className = "message error";
    message.textContent = error.message;
  }
}

/* ===================================
   RESTORE SESSION
=================================== */

async function restoreSession() {
  const token = sessionStorage.getItem("vivex_admin_token");
  if (!token) return;

  try {
    const payload = JSON.parse(
      atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))
    );

    if (!payload.exp || payload.exp * 1000 <= Date.now()) {
      sessionStorage.removeItem("vivex_admin_token");
      return;
    }

    idToken = token;

    const result = await callBackend("adminLogin");

    if (!result.success) {
      throw new Error("Admin access expired.");
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    await loadDashboard();

  } catch (error) {
    idToken = "";
    sessionStorage.removeItem("vivex_admin_token");
  }
}

/* ===================================
   LOAD ALL DATA
=================================== */

async function loadDashboard() {
  const content = document.getElementById("content");
  const message = document.getElementById("actionMessage");

  message.textContent = "";
  content.innerHTML = '<div class="empty">Loading data...</div>';

  try {
    const [pending, approved, rejected] = await Promise.all([
      callBackend("getPendingPayments"),
      callBackend("getPaymentHistory", { status: "Approved" }),
      callBackend("getPaymentHistory", { status: "Rejected" })
    ]);

    if (!pending.success) {
      throw new Error(pending.message || "Unable to load new requests.");
    }
    if (!approved.success) {
      throw new Error(approved.message || "Unable to load approved records.");
    }
    if (!rejected.success) {
      throw new Error(rejected.message || "Unable to load rejected records.");
    }

    pendingPayments = pending.payments || [];
    approvedPayments = approved.payments || [];
    rejectedPayments = rejected.payments || [];

    document.getElementById("pendingCount").textContent =
      pendingPayments.length;

    document.getElementById("approvedCount").textContent =
      approvedPayments.length;

    document.getElementById("rejectedCount").textContent =
      rejectedPayments.length;

    renderCurrentTab();

  } catch (error) {
    content.innerHTML = "";
    message.className = "message error";
    message.textContent = error.message;
  }
}

/* ===================================
   TABS
=================================== */

function showTab(tab, button) {
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(item => {
    item.classList.remove("active");
  });

  button.classList.add("active");
  renderCurrentTab();
}

function renderCurrentTab() {
  if (currentTab === "pending") {
    renderPayments(
      pendingPayments,
      "New Payment Requests",
      "pending"
    );
  }

  if (currentTab === "approved") {
    renderPayments(
      approvedPayments,
      "Approved Payments",
      "approved"
    );
  }

  if (currentTab === "rejected") {
    renderPayments(
      rejectedPayments,
      "Rejected Payments",
      "rejected"
    );
  }
}

/* ===================================
   SAFE CARD RENDERING
=================================== */

function makeElement(tag, className, value) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (value !== undefined) element.textContent = value;
  return element;
}

function renderPayments(payments, heading, type) {
  const content = document.getElementById("content");
  content.replaceChildren();

  content.appendChild(
    makeElement("div", "section-heading", heading)
  );

  if (!payments.length) {
    content.appendChild(
      makeElement("div", "empty", "No records found.")
    );
    return;
  }

  payments.forEach(payment => {
    const card = makeElement(
      "div",
      "request-card " + type
    );

    const top = makeElement("div", "card-top");
    top.appendChild(
      makeElement("div", "person-name", payment.name || "Unknown User")
    );

    const status = makeElement(
      "span",
      "status " + type,
      type === "pending" ? "NEW REQUEST" : type.toUpperCase()
    );

    top.appendChild(status);
    card.appendChild(top);

    card.appendChild(makeElement(
      "div", "detail", "Gmail: " + (payment.email || "-")
    ));

    card.appendChild(makeElement(
      "div", "detail", "UTR: " + (payment.utr || "-")
    ));

    card.appendChild(makeElement(
      "div", "detail", "Plan: " + (payment.plan || "-")
    ));

    card.appendChild(makeElement(
      "div", "detail", "Amount: ₹" + (payment.amount ?? "-")
    ));

    if (type === "pending") {
      const actions = makeElement("div", "card-actions");

      const approve = makeElement("button", "action approve", "✓ APPROVE");
      approve.onclick = () => processRequest(payment.utr, "approve", approve, reject);

      const reject = makeElement("button", "action reject", "✕ REJECT");
      reject.onclick = () => processRequest(payment.utr, "reject", approve, reject);

      actions.append(approve, reject);
      card.appendChild(actions);
    }

    content.appendChild(card);
  });
}

/* ===================================
   APPROVE / REJECT
=================================== */

async function processRequest(utr, decision, approveButton, rejectButton) {
  if (!utr) {
    alert("UTR is missing.");
    return;
  }

  const isApprove = decision === "approve";

  const confirmed = confirm(
    isApprove
      ? "Have you independently verified this payment in your UPI/bank account? Approve this membership?"
      : "Are you sure you want to reject this payment request?"
  );

  if (!confirmed) return;

  approveButton.disabled = true;
  rejectButton.disabled = true;

  const message = document.getElementById("actionMessage");
  message.className = "message";
  message.textContent = "Processing request...";

  try {
    const result = await callBackend("processPayment", {
      utr,
      decision
    });

    if (!result.success) {
      throw new Error(result.message || "Action failed.");
    }

    message.className = "message success";
    message.textContent = isApprove
      ? "Payment approved. Membership has been processed."
      : "Payment rejected. No membership was activated.";

    await loadDashboard();

  } catch (error) {
    approveButton.disabled = false;
    rejectButton.disabled = false;

    message.className = "message error";
    message.textContent = error.message;
  }
}

/* ===================================
   LOGOUT
=================================== */

function logout() {
  sessionStorage.removeItem("vivex_admin_token");
  idToken = "";

  pendingPayments = [];
  approvedPayments = [];
  rejectedPayments = [];

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("loginMessage").textContent = "";

  currentTab = "pending";

  document.querySelectorAll(".tab").forEach(item => {
    item.classList.remove("active");
  });
  document.querySelector(".tab").classList.add("active");
}

/* ===================================
   START
=================================== */

window.addEventListener("load", () => {
  initializeGoogle();
  restoreSession();
});
</script>
</body>
</html>
